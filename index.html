<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Three Brothers Guest House</title>
<meta name="theme-color" content="#16382C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{
  --green:#16382C; --green2:#1F4B3A; --gold:#C9962C; --gold2:#E4B15A;
  --cream:#FBF7EE; --sage:#EEF1E7; --ink:#22281F; --clay:#B5542A; --ok:#3C6E47;
  --line:#DCD5C4;
  --font-d: Georgia,'Iowan Old Style','Palatino Linotype',serif;
  --font-b: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:var(--font-b);}
body{padding-bottom:78px;min-height:100vh;}
h1,h2,h3{font-family:var(--font-d);margin:0 0 8px;color:var(--green);}
a{color:inherit;}
button{font-family:var(--font-b);cursor:pointer;}
::selection{background:var(--gold2);}
#splash{position:fixed;inset:0;background:var(--green);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .4s}
#splash svg{width:88px;height:88px;margin-bottom:14px}
#splash .tag{font-family:var(--font-d);font-size:20px;letter-spacing:.5px}
#splash .sub{font-size:12px;opacity:.75;margin-top:4px}
header{background:var(--green);color:var(--cream);padding:14px 16px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header svg{width:34px;height:34px;flex:none}
header .htxt{flex:1;min-width:0}
header .htxt b{font-family:var(--font-d);font-size:17px;display:block;line-height:1.15}
header .htxt span{font-size:11px;opacity:.75}
header .today{font-size:11px;opacity:.85;text-align:right}
main{padding:14px 14px 24px;max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sage);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--font-d);font-size:20px;color:var(--green)}
.stat span{font-size:11px;color:#5b6157}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.section-title h2{font-size:16px}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600}
.pill.vacant{background:#e4f0e6;color:var(--ok)}
.pill.occupied{background:#f6e6da;color:var(--clay)}
.pill.cleaning{background:#eee8d6;color:#8a7126}
.room-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.room-row:last-child{border-bottom:none}
.room-num{font-family:var(--font-d);font-size:18px;color:var(--green);width:34px}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:10px}
.row:last-child{border-bottom:none}
.row .meta{font-size:11px;color:#6b7166}
.amt{font-weight:700;color:var(--green)}
.amt.neg{color:var(--clay)}
.btn{background:var(--green);color:var(--cream);border:none;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:600}
.btn.gold{background:var(--gold);color:var(--green)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.block{width:100%}
.fab{position:fixed;right:16px;bottom:88px;width:52px;height:52px;border-radius:50%;background:var(--gold);color:var(--green);font-size:26px;border:none;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:15}
nav#bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--green);display:flex;z-index:30;box-shadow:0 -2px 10px rgba(0,0,0,.2);padding-bottom:env(safe-area-inset-bottom)}
nav#bottomnav button{flex:1;background:none;border:none;color:#cfd9cf;font-size:10px;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav#bottomnav button.active{color:var(--gold2)}
nav#bottomnav svg{width:20px;height:20px}
#moreSheet{position:fixed;inset:0;background:rgba(20,28,20,.5);z-index:40;display:none}
#moreSheet.open{display:block}
#moreSheet .panel{position:absolute;bottom:0;left:0;right:0;background:var(--cream);border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
#moreSheet .opt{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
#moreSheet .opt:last-child{border:none}
.modal-wrap{position:fixed;inset:0;background:rgba(20,28,20,.5);z-index:50;display:none;align-items:flex-end}
.modal-wrap.open{display:flex}
.modal{background:var(--cream);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.modal h3{font-size:17px}
label{display:block;font-size:12px;font-weight:600;color:#4b5147;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;font-family:var(--font-b)}
textarea{min-height:60px}
.row-actions{display:flex;gap:8px;margin-top:16px}
.row-actions .btn{flex:1}
.empty{text-align:center;padding:30px 10px;color:#8a8f80}
.empty b{display:block;color:var(--green);font-family:var(--font-d);margin-bottom:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:12.5px;white-space:nowrap}
.tabs button.active{background:var(--green);color:var(--cream);border-color:var(--green)}
.badge-low{background:#f8e4dc;color:var(--clay);font-size:10px;padding:2px 7px;border-radius:99px;margin-left:6px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.calcFab{position:fixed;right:16px;bottom:148px;width:44px;height:44px;border-radius:50%;background:var(--green);color:var(--gold2);border:none;font-size:18px;box-shadow:0 4px 10px rgba(0,0,0,.2);z-index:15}
.calc{width:100%}
.calc .disp{background:var(--ink);color:#fff;font-family:var(--font-d);font-size:26px;padding:14px;border-radius:10px;text-align:right;margin-bottom:10px;min-height:24px;word-break:break-all}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc .keys button{padding:16px 0;font-size:17px;border-radius:10px;border:1px solid var(--line);background:#fff}
.calc .keys button.op{background:var(--sage)}
.calc .keys button.eq{background:var(--gold);grid-column:span 2}
.photo-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.scan-box{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:#6b7166;font-size:13px}
small.hint{display:block;color:#8a8f80;font-size:11px;margin-top:4px}
.nowrap{white-space:nowrap}
.chip{font-size:11px;background:var(--sage);padding:3px 8px;border-radius:99px}
.noalc{display:inline-flex;align-items:center;gap:4px;font-size:10px;background:#e4f0e6;color:var(--ok);padding:3px 8px;border-radius:99px;font-weight:700}
</style>
</head>
<body>

<div id="splash">
  <svg viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#16382C"/><polygon points="256,120 356,260 156,260" fill="#C9962C"/><polygon points="150,180 230,300 70,300" fill="#E4B15A" opacity="0.92"/><polygon points="362,180 442,300 282,300" fill="#E4B15A" opacity="0.92"/><rect x="120" y="300" width="272" height="96" rx="10" fill="#FBF7EE"/><rect x="230" y="330" width="52" height="66" rx="4" fill="#16382C"/></svg>
  <div class="tag">Three Brothers Guest House</div>
  <div class="sub">Morogoro &middot; loading&hellip;</div>
</div>

<header>
  <svg viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#16382C"/><polygon points="256,120 356,260 156,260" fill="#C9962C"/><polygon points="150,180 230,300 70,300" fill="#E4B15A" opacity="0.92"/><polygon points="362,180 442,300 282,300" fill="#E4B15A" opacity="0.92"/><rect x="120" y="300" width="272" height="96" rx="10" fill="#FBF7EE"/><rect x="230" y="330" width="52" height="66" rx="4" fill="#16382C"/></svg>
  <div class="htxt"><b>Three Brothers</b><span>Guest House &middot; Morogoro</span></div>
  <div class="today" id="todayLbl"></div>
</header>

<main id="view"></main>

<button class="fab" id="fabAdd" title="Add">+</button>
<button class="calcFab" id="calcFab" title="Calculator">&#9673;</button>

<nav id="bottomnav">
  <button data-v="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>Home</button>
  <button data-v="rooms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Rooms</button>
  <button data-v="bookings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>Bookings</button>
  <button data-v="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Money</button>
  <button data-v="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
</nav>

<div id="moreSheet">
  <div class="panel">
    <h3>More</h3>
    <div class="opt" data-v="restaurant">&#127869; Restaurant</div>
    <div class="opt" data-v="inventory">&#128230; Inventory</div>
    <div class="opt" data-v="staff">&#128101; Staff & Payroll</div>
    <div class="opt" data-v="reports">&#128202; Reports</div>
    <div class="opt" data-v="scan">&#128247; Scan Receipt</div>
    <div class="opt" data-v="settings">&#128190; Data & Settings</div>
    <button class="btn ghost block" id="closeMore" style="margin-top:8px">Close</button>
  </div>
</div>

<div class="modal-wrap" id="modalWrap"><div class="modal" id="modalBody"></div></div>
<div class="modal-wrap" id="calcWrap"><div class="modal"><h3>Calculator</h3><div class="calc" id="calcRoot"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== DB LAYER ===================== */
const DB_NAME='threeBrothersDB', DB_VERSION=1;
const STORES=['rooms','bookings','menu','orders','income','expenses','inventory','staff','staffTx','settings'];
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=(e)=>{
      const db=e.target.result;
      STORES.forEach(name=>{ if(!db.objectStoreNames.contains(name)) db.createObjectStore(name,{keyPath:'id',autoIncrement:true}); });
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
let DB;
function st(name,mode='readonly'){ return DB.transaction(name,mode).objectStore(name); }
function dbAdd(name,val){ return new Promise((res,rej)=>{ const r=st(name,'readwrite').add(val); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbPut(name,val){ return new Promise((res,rej)=>{ const r=st(name,'readwrite').put(val); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbDel(name,id){ return new Promise((res,rej)=>{ const r=st(name,'readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
function dbGetAll(name){ return new Promise((res,rej)=>{ const r=st(name).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbGet(name,id){ return new Promise((res,rej)=>{ const r=st(name).get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }

/* ===================== HELPERS ===================== */
const TSh=(n)=> 'TSh ' + Math.round(n||0).toLocaleString('en-US');
const fmtDate=(d)=> new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const todayISO=()=> new Date().toISOString().slice(0,10);
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function within(dateStr,start,end){ return dateStr>=start && dateStr<=end; }
function monthRange(offset=0){
  const d=new Date(); d.setMonth(d.getMonth()+offset);
  const y=d.getFullYear(), m=d.getMonth();
  const start=new Date(y,m,1).toISOString().slice(0,10);
  const end=new Date(y,m+1,0).toISOString().slice(0,10);
  return {start,end,label:d.toLocaleDateString('en-GB',{month:'long',year:'numeric'})};
}
function weekRange(){
  const now=new Date(); const day=(now.getDay()+6)%7;
  const start=new Date(now); start.setDate(now.getDate()-day);
  const end=new Date(start); end.setDate(start.getDate()+6);
  return {start:start.toISOString().slice(0,10), end:end.toISOString().slice(0,10)};
}
function fileToDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

/* ===================== APP STATE ===================== */
const state={ view:'dashboard', rooms:[], bookings:[], menu:[], orders:[], income:[], expenses:[], inventory:[], staff:[], staffTx:[] };

async function loadAll(){
  const [rooms,bookings,menu,orders,income,expenses,inventory,staff,staffTx]=await Promise.all(
    STORES.filter(s=>s!=='settings').map(dbGetAll)
  );
  state.rooms=rooms; state.bookings=bookings; state.menu=menu; state.orders=orders;
  state.income=income; state.expenses=expenses; state.inventory=inventory; state.staff=staff; state.staffTx=staffTx;
}

const GUEST_ROOM_NUMBERS=[2,3,4,5,6,7,8,9,21,22,23];
async function seedIfEmpty(){
  const rooms=await dbGetAll('rooms');
  if(rooms.length===0){
    for(const n of GUEST_ROOM_NUMBERS){
      await dbAdd('rooms',{number:n,type:'Standard',rate:0,status:'vacant',isStaff:false});
    }
    await dbAdd('rooms',{number:'Staff',type:'Staff Room',rate:0,status:'occupied',isStaff:true});
  }
  const menu=await dbGetAll('menu');
  if(menu.length===0){
    const starter=[
      {name:'Chapati',price:1000,category:'Breakfast'},
      {name:'Chai',price:1000,category:'Beverage'},
      {name:'Ugali & Nyama',price:6000,category:'Lunch'},
      {name:'Pilau',price:6000,category:'Lunch'},
      {name:'Soda',price:1500,category:'Beverage'},
      {name:'Samaki wa Kupaka',price:8000,category:'Dinner'}
    ];
    for(const m of starter) await dbAdd('menu',m);
  }
}

/* ===================== INCOME AGGREGATION ===================== */
function bookingIncomeInRange(start,end){
  return state.bookings.filter(b=>within(b.checkIn,start,end)).reduce((s,b)=>s+(b.amount||0),0);
}
function restaurantIncomeInRange(start,end){
  return state.orders.filter(o=>within(o.date,start,end)).reduce((s,o)=>s+(o.total||0),0);
}
function manualIncomeInRange(start,end){
  return state.income.filter(i=>within(i.date,start,end)).reduce((s,i)=>s+(i.amount||0),0);
}
function expensesInRange(start,end){
  return state.expenses.filter(e=>within(e.date,start,end)).reduce((s,e)=>s+(e.amount||0),0);
}
function payrollOutInRange(start,end){
  return state.staffTx.filter(t=>t.type==='payment' && within(t.date,start,end)).reduce((s,t)=>s+(t.amount||0),0)
       + state.staffTx.filter(t=>(t.type==='advance'||t.type==='oneoff') && within(t.date,start,end)).reduce((s,t)=>s+(t.amount||0),0);
}
function totalIncome(start,end){ return bookingIncomeInRange(start,end)+restaurantIncomeInRange(start,end)+manualIncomeInRange(start,end); }
function totalOut(start,end){ return expensesInRange(start,end)+payrollOutInRange(start,end); }

/* ===================== ROUTER ===================== */
function setView(v){
  state.view=v;
  document.querySelectorAll('#bottomnav button').forEach(b=>b.classList.toggle('active', b.dataset.v===v));
  document.getElementById('moreSheet').classList.remove('open');
  render();
}
document.querySelectorAll('#bottomnav button').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.v==='more'){ document.getElementById('moreSheet').classList.add('open'); return; }
  setView(b.dataset.v);
}));
document.getElementById('closeMore').addEventListener('click',()=>document.getElementById('moreSheet').classList.remove('open'));
document.querySelectorAll('#moreSheet .opt').forEach(o=>o.addEventListener('click',()=>setView(o.dataset.v)));
document.getElementById('moreSheet').addEventListener('click',(e)=>{ if(e.target.id==='moreSheet') e.currentTarget.classList.remove('open'); });

/* ===================== MODAL ===================== */
function openModal(html){ document.getElementById('modalBody').innerHTML=html; document.getElementById('modalWrap').classList.add('open'); }
function closeModal(){ document.getElementById('modalWrap').classList.remove('open'); document.getElementById('modalBody').innerHTML=''; }
document.getElementById('modalWrap').addEventListener('click',(e)=>{ if(e.target.id==='modalWrap') closeModal(); });

/* ===================== FAB (context-aware add) ===================== */
document.getElementById('fabAdd').addEventListener('click',()=>{
  const v=state.view;
  if(v==='rooms') return openRoomForm();
  if(v==='bookings') return openBookingForm();
  if(v==='money') return openMoneyChoice();
  if(v==='restaurant') return openOrderForm();
  if(v==='inventory') return openInventoryForm();
  if(v==='staff') return openStaffChoice();
  toast('Choose a section first (Rooms, Bookings, Money...)');
});

/* ===================== DASHBOARD ===================== */
function renderDashboard(){
  const t=todayISO(); const wk=weekRange(); const mo=monthRange();
  const guestRooms=state.rooms.filter(r=>!r.isStaff);
  const occ=guestRooms.filter(r=>r.status==='occupied').length;
  const todayIncome=totalIncome(t,t);
  const monthIncome=totalIncome(mo.start,mo.end);
  const monthOut=totalOut(mo.start,mo.end);
  const low=state.inventory.filter(i=>i.qty<=i.lowStockThreshold);
  const upcomingCheckouts=state.bookings.filter(b=>b.checkOut===t);
  return `
  <div class="grid2">
    <div class="stat"><b>${occ}/${guestRooms.length}</b><span>Rooms occupied today</span></div>
    <div class="stat"><b>${TSh(todayIncome)}</b><span>Today's income</span></div>
  </div>
  <div class="grid2" style="margin-top:10px">
    <div class="stat"><b>${TSh(monthIncome)}</b><span>Income this month (${mo.label})</span></div>
    <div class="stat"><b>${TSh(monthIncome-monthOut)}</b><span>Profit this month (Net)</span></div>
  </div>
  ${low.length? `<div class="section-title"><h2>&#9888; Low stock items</h2></div>
    <div class="card">${low.map(i=>`<div class="row"><span>${i.name}</span><span class="meta">${i.qty} ${i.unit} left</span></div>`).join('')}</div>` : ''}
  ${upcomingCheckouts.length? `<div class="section-title"><h2>Check-out today</h2></div>
    <div class="card">${upcomingCheckouts.map(b=>{const r=state.rooms.find(rm=>rm.id===b.roomId);return `<div class="row"><span>Room ${r?r.number:'?'} &middot; ${b.guestName}</span><span class="amt">${TSh(b.amount)}</span></div>`}).join('')}</div>` : ''}
  <div class="section-title"><h2>Recent expenses</h2><span class="chip" onclick="setView('money')">View all</span></div>
  <div class="card">${recentExpensesHTML(5)}</div>
  `;
}
function recentExpensesHTML(n){
  const items=[...state.expenses].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n);
  if(!items.length) return `<div class="empty"><b>No expenses yet</b>Tap + to add</div>`;
  return items.map(e=>`<div class="row"><span>${e.category}<br><span class="meta">${fmtDate(e.date)}${e.note?' &middot; '+e.note:''}</span></span><span class="amt neg">-${TSh(e.amount)}</span></div>`).join('');
}

/* ===================== ROOMS ===================== */
function renderRooms(){
  const guestCount=state.rooms.filter(r=>!r.isStaff).length;
  const html=[...state.rooms].sort((a,b)=> a.isStaff!==b.isStaff ? (a.isStaff?1:-1) : (a.number-b.number)).map(r=>{
    const booking=state.bookings.find(b=>b.roomId===r.id && b.status==='active');
    return `<div class="room-row">
      <div class="room-num">${r.isStaff?'STAFF':'#'+r.number}</div>
      <div style="flex:1;padding:0 10px">
        <div>${r.type} &middot; ${TSh(r.rate)}/night</div>
        ${booking? `<div class="meta">${booking.guestName} &middot; until ${fmtDate(booking.checkOut)}</div>`:''}
      </div>
      <span class="pill ${r.status}">${r.status}</span>
      <button class="btn sm ghost" style="margin-left:8px" onclick="openRoomForm(${r.id})">Edit</button>
    </div>`;
  }).join('');
  return `<div class="section-title"><h2>Rooms (${guestCount} + staff room)</h2></div><div class="card">${html}</div>
  <small class="hint">Tap "Edit" to change a room's type, rate or status. A new booking will automatically set it to "occupied".</small>`;
}

async function saveBooking(id){
  const roomId=+document.getElementById('f_room').value;
  const checkIn=document.getElementById('f_in').value, checkOut=document.getElementById('f_out').value;

  const obj={ roomId, guestName:document.getElementById('f_guest').value, phone:document.getElementById('f_phone').value,
    checkIn, checkOut, nights, amount:+document.getElementById('f_amount').value, paid:document.getElementById('f_paid').checked,
    status:'active', createdAt:todayISO() };

  await dbPut('bookings',obj);
  const room=state.rooms.find(r=>r.id===roomId);

}

function staffBalance(staffId,start,end){
  const tx=state.staffTx.filter(t=>t.staffId===staffId && within(t.date,start,end));
  const allow=tx.filter(t=>t.type==='allowance').reduce((s,t)=>s+t.amount,0);
  const adv=tx.filter(t=>t.type==='advance'||t.type==='oneoff').reduce((s,t)=>s+t.amount,0);
  const paid=tx.filter(t=>t.type==='payment').reduce((s,t)=>s+t.amount,0);
  const staffMember=state.staff.find(s=>s.id===staffId);
  const base=staffMember?staffMember.baseSalary:0;
  return { base, allow, adv, paid, owed: base+allow-adv-paid };
}

    <button class="${reportRange==='today'?'active':''}" onclick="setReportRange('today')">Today</button>
    <button class="${reportRange==='week'?'active':''}" onclick="setReportRange('week')">Week</button>
    <button class="${reportRange==='month'?'active':''}" onclick="setReportRange('month')">Month</button>
  </div>
  <div class="card">
    <h3 style="font-size:15px">${label}</h3>
    <div class="row"><span>Room income</span><span class="amt">${TSh(bi)}</span></div>
    <div class="row"><span>Restaurant income</span><span class="amt">${TSh(ri)}</span></div>
    <div class="row"><span>Other income</span><span class="amt">${TSh(mi)}</span></div>
    <div class="row"><b>Total Income</b><b class="amt">${TSh(inc)}</b></div>
  </div>
  <div class="card">
    <h3 style="font-size:15px">Expenses by category</h3>
    ${Object.keys(byCat).length? Object.entries(byCat).map(([c,a])=>`<div class="row"><span>${c}</span><span class="amt neg">${TSh(a)}</span></div>`).join(''):'<div class="empty">No expenses</div>'}
    <div class="row"><span>Staff payments</span><span class="amt neg">${TSh(pay)}</span></div>
    <div class="row"><b>Total Expenses</b><b class="amt neg">${TSh(out)}</b></div>
  </div>
  <div class="card" style="background:var(--green);color:var(--cream)">
    <div class="row" style="border:none"><b style="font-family:var(--font-d);font-size:18px">Net Profit</b><b style="font-family:var(--font-d);font-size:18px;color:${inc-out>=0?'var(--gold2)':'#f0a58b'}">${TSh(inc-out)}</b></div>
  </div>
  <button class="btn ghost block" onclick="exportCSV('${s}','${e}','${label.replace(/'/g,"")}')">Download CSV (Excel)</button>`;
}
function setReportRange(r){ reportRange=r; render(); }
function exportCSV(s,e,label){
  let rows=[['Type','Date','Description','Amount (TSh)']];
  state.bookings.filter(b=>within(b.checkIn,s,e)).forEach(b=>rows.push(['Income-Room',b.checkIn,b.guestName,b.amount]));
  state.orders.filter(o=>within(o.date,s,e)).forEach(o=>rows.push(['Income-Restaurant',o.date,o.items.map(i=>i.qty+'x'+i.name).join('; '),o.total]));
  state.income.filter(i=>within(i.date,s,e)).forEach(i=>rows.push(['Income-Other',i.date,i.source,i.amount]));
  state.expenses.filter(x=>within(x.date,s,e)).forEach(x=>rows.push(['Expense',x.date,x.category+(x.note?' - '+x.note:''),-x.amount]));
  state.staffTx.filter(t=>within(t.date,s,e)).forEach(t=>rows.push(['Staff-'+t.type,t.date,(state.staff.find(x=>x.id===t.staffId)||{}).name||'',-t.amount]));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`ThreeBrothers_${label.replace(/\s/g,'_')}.csv`; a.click();
}

/* ===================== SCAN RECEIPT (OCR) ===================== */
let tesseractLoaded=false;
function loadTesseract(){
  return new Promise((resolve,reject)=>{
    if(tesseractLoaded) return resolve();
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js';
    s.onload=()=>{ tesseractLoaded=true; resolve(); };
    s.onerror=()=>reject(new Error('offline'));
    document.head.appendChild(s);
  });
}
function renderScan(){
  return `<div class="section-title"><h2>Scan Receipt</h2></div>
  <div class="scan-box">
    &#128247;<br><br>Take a photo of a shop or restaurant receipt.<br>Numbers will be detected automatically (needs internet only the first time).
    <br><br><input type="file" accept="image/*" capture="environment" id="scanInput">
  </div>
  <div id="scanResult" style="margin-top:14px"></div>`;
}
document.addEventListener('change',async(e)=>{
  if(e.target && e.target.id==='scanInput'){
    const file=e.target.files[0]; if(!file) return;
    const dataUrl=await fileToDataURL(file);
    const resultEl=document.getElementById('scanResult');
    resultEl.innerHTML=`<div class="card"><img class="photo-thumb" style="width:100%;height:auto" src="${dataUrl}"><p class="meta" style="margin-top:8px">Reading numbers...</p></div>`;
    try{
      await loadTesseract();
      const { data:{ text } } = await Tesseract.recognize(dataUrl,'eng');
      const numbers=(text.match(/\d[\d,\.]{2,}/g)||[]).map(n=>n.replace(/[,\.]/g,'')).filter(n=>+n>500);
      resultEl.innerHTML=`<div class="card">
        <img class="photo-thumb" style="width:100%;height:auto" src="${dataUrl}">
        <p class="meta" style="margin:8px 0">Numbers found &mdash; tap the correct one:</p>
        ${numbers.length? numbers.map(n=>`<button class="btn sm ghost" style="margin:3px" onclick='closeModal();openExpenseForm(null,${n},${JSON.stringify(dataUrl)})'>${TSh(+n)}</button>`).join(''):'<span class="meta">No number detected &mdash; enter manually</span>'}
        <div class="row-actions"><button class="btn block" onclick='openExpenseForm(null,null,${JSON.stringify(dataUrl)})'>Enter Manually (keep this photo)</button></div>
      </div>`;
    }catch(err){
      resultEl.innerHTML=`<div class="card"><img class="photo-thumb" style="width:100%;height:auto" src="${dataUrl}">
        <p class="meta" style="margin:8px 0">Reading numbers needs internet the first time. You can enter the amount manually &mdash; the photo is saved.</p>
        <button class="btn block" onclick='openExpenseForm(null,null,${JSON.stringify(dataUrl)})'>Enter Manually</button></div>`;
    }
  }
});

/* ===================== SETTINGS / DATA ===================== */
function renderSettings(){
  return `<div class="section-title"><h2>Data & Settings</h2></div>
  <div class="card">
    <p class="meta">All data is stored on this phone only (offline). Nothing is sent online.</p>
    <button class="btn block" onclick="backupData()">Download Backup (JSON)</button>
    <br><br>
    <label>Restore from Backup</label>
    <input type="file" accept="application/json" id="restoreInput">
  </div>
  <div class="card">
    <p class="meta">Three Brothers Guest House &middot; Morogoro, Tanzania</p>
    <p class="meta">Built by LERO Systems / Consulting</p>
  </div>`;
}
async function backupData(){
  const all={};
  for(const s of STORES) all[s]=await dbGetAll(s);
  const blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`ThreeBrothers_backup_${todayISO()}.json`; a.click();
}
document.addEventListener('change',async(e)=>{
  if(e.target && e.target.id==='restoreInput'){
    const file=e.target.files[0]; if(!file) return;
    const text=await file.text(); const data=JSON.parse(text);
    for(const s of STORES){ if(data[s]) for(const item of data[s]) await dbPut(s,item); }
    await loadAll(); toast('Data restored'); render();
  }
});

/* ===================== CALCULATOR ===================== */
let calcExpr='';
function renderCalc(){
  const keys=['7','8','9','÷','4','5','6','×','1','2','3','-','0','.','C','+','='];
  document.getElementById('calcRoot').innerHTML=`<div class="disp" id="calcDisp">0</div>
    <div class="keys">
      ${keys.map(k=>`<button class="${'+-×÷'.includes(k)?'op':''} ${k==='='?'eq':''}" onclick="calcPress('${k}')">${k}</button>`).join('')}
    </div>
    <button class="btn ghost block" style="margin-top:10px" onclick="document.getElementById('calcWrap').classList.remove('open')">Close</button>`;
}
function calcPress(k){
  if(k==='C'){ calcExpr=''; }
  else if(k==='='){ try{ calcExpr=String(eval(calcExpr.replace(/×/g,'*').replace(/÷/g,'/'))); }catch(e){ calcExpr='Error'; } }
  else calcExpr+=k;
  document.getElementById('calcDisp').textContent=calcExpr||'0';
}
document.getElementById('calcFab').addEventListener('click',()=>{ renderCalc(); document.getElementById('calcWrap').classList.add('open'); });
document.getElementById('calcWrap').addEventListener('click',(e)=>{ if(e.target.id==='calcWrap') e.currentTarget.classList.remove('open'); });

/* ===================== MAIN RENDER ===================== */
function render(){
  const el=document.getElementById('view');
  const map={ dashboard:renderDashboard, rooms:renderRooms, bookings:renderBookings, money:renderMoney,
    restaurant:renderRestaurant, inventory:renderInventory, staff:renderStaff, reports:renderReports,
    scan:renderScan, settings:renderSettings, more:renderDashboard };
  el.innerHTML=(map[state.view]||renderDashboard)();
}

/* ===================== INIT ===================== */
(async function init(){
  document.getElementById('todayLbl').textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'});
  DB=await openDB();
  await seedIfEmpty();
  await loadAll();
  setView('dashboard');
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
  setTimeout(()=>{ document.getElementById('splash').style.opacity='0'; setTimeout(()=>document.getElementById('splash').remove(),400); },600);
})();
</script>
